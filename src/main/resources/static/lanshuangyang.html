<!DOCTYPE html>

    <script src="/static/jquery.min.js"></script>
    <script src="/static/bootstrap-3.3.7-dist/js/bootstrap.js"></script>

    <style>
        @keyframes roll1 {
            0% {
                top: 0%;
            }
            80% {
                top: 50%;
            }
            100% {
                top: 0%;
            }
        }

        @keyframes roll2 {
            0% {
                top: 20%;
            }
            30% {
                top: 45%;
            }
            100% {
                top: 20%;
            }
        }

        .go_down_a1 {
            position: absolute;
            top: 0%;
            left: 0%;
            animation: roll1 1s;
            animation-direction: alternate;
            animation-iteration-count: infinite;
        }

        .go_down_a2 {
            top: 20%;
            left: 0%;
            position: absolute;
            animation: roll2 0.6s;
            animation-direction: alternate;
            animation-iteration-count: infinite;

        }

        .title-bg {
            border-radius: 30px;
            padding: 9px 40px;
            background-color: transparent
        }

        .title-bg:hover {
            background-color: rgba(0, 0, 0, 0.7)
        }

        .top-nav {
            display: inline-block;
        }

        .top-nav a {
            color: #ffffff
        }

        .top-nav a:hover, .top-nav a:active, .top-nav a:focus {
            color: #ffffff !important;
            background-color: rgba(0, 0, 0, 0.5) !important;
        }

        .text-white {
            color: #ffffff
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow: auto;
        }

        body::-webkit-scrollbar {
            display: none;
        / / Safari and Chrome
        }

        body {
            -ms-overflow-style: none;
        / / IE 10 + overflow: -moz-scrollbars-none;
        / / Firefox
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .top_page {
            height: 100vh
        }

        .user_info {
            color: #fff;
            background: -webkit-linear-gradient(30deg, #000000, #0f0f0f); /* Safari 5.1 - 6.0 */
            background: -o-linear-gradient(#000000, #0f0f0f); /* Opera 11.1 - 12.0 */
            background: -moz-linear-gradient(#000000, #0f0f0f); /* Firefox 3.6 - 15 */
            background: linear-gradient(rgb(47, 47, 47), rgb(103, 103, 103)); /* 标准的语法（必须放在最后） */
        }
    </style>
</head>
